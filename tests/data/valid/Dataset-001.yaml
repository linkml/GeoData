# Example dataset containing soil pH and water turbidity measurements
dataset_id: https://doi.org/10.0000/geodata-example-001
title: "Example Multi-Matrix Measurement Dataset"
description: >-
  A small example dataset demonstrating Measurement objects across
  soil and freshwater matrices, for schema validation purposes.
creator: "Anne Thessen"
publisher: "LinkML GeoData Project"
license: https://creativecommons.org/licenses/by/4.0/
version: "1.0.0"
