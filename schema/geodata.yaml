name: geodata
description: A linked data schema for describing the data holdings of diverse earth
  science repositories. Centres on Measurement, AggregateObservation, Specimen, and
  TimeSeries, with alignment to SOSA/SSN, iSamples, NMDC, Science on Schema.org, and
  GeoLink.
title: Earth Science Data Schema
see_also:
- https://linkml.github.io/geodata
id: https://w3id.org/linkml/geodata
version: 0.1.0
imports:
- linkml:types
license: BSD-3-Clause
prefixes:
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  geodata:
    prefix_prefix: geodata
    prefix_reference: https://w3id.org/linkml/geodata/
  schema:
    prefix_prefix: schema
    prefix_reference: http://schema.org/
  sosa:
    prefix_prefix: sosa
    prefix_reference: http://www.w3.org/ns/sosa/
  ssn:
    prefix_prefix: ssn
    prefix_reference: http://www.w3.org/ns/ssn/
  qudt:
    prefix_prefix: qudt
    prefix_reference: http://qudt.org/schema/qudt/
  unit:
    prefix_prefix: unit
    prefix_reference: http://qudt.org/vocab/unit/
  envo:
    prefix_prefix: envo
    prefix_reference: http://purl.obolibrary.org/obo/ENVO_
  sweet:
    prefix_prefix: sweet
    prefix_reference: http://sweetontology.net/
  geo:
    prefix_prefix: geo
    prefix_reference: http://www.opengis.net/ont/geosparql#
  owl_time:
    prefix_prefix: owl_time
    prefix_reference: http://www.w3.org/2006/time#
  gl:
    prefix_prefix: gl
    prefix_reference: http://schema.geolink.org/1.0/base/main#
  nmdc:
    prefix_prefix: nmdc
    prefix_reference: https://w3id.org/nmdc/
  isam:
    prefix_prefix: isam
    prefix_reference: https://w3id.org/isample/
  prov:
    prefix_prefix: prov
    prefix_reference: http://www.w3.org/ns/prov#
  xsd:
    prefix_prefix: xsd
    prefix_reference: http://www.w3.org/2001/XMLSchema#
default_prefix: geodata
default_range: string
types:
  DecimalDegree:
    name: DecimalDegree
    definition_uri: https://w3id.org/linkml/geodata/DecimalDegree
    description: A coordinate value expressed in decimal degrees.
    from_schema: https://w3id.org/linkml/geodata
    base: float
    uri: xsd:double
  UCUMExpression:
    name: UCUMExpression
    definition_uri: https://w3id.org/linkml/geodata/UCUMExpression
    description: A unit expression in UCUM notation (e.g. "m/s", "Cel", "g/cm3").
    from_schema: https://w3id.org/linkml/geodata
    base: str
    uri: xsd:string
  WKTLiteral:
    name: WKTLiteral
    definition_uri: https://w3id.org/linkml/geodata/WKTLiteral
    description: A geometry encoded as a Well-Known Text (WKT) literal.
    from_schema: https://w3id.org/linkml/geodata
    base: str
    uri: geo:wktLiteral
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string. If you are authoring schemas in LinkML YAML, the type is referenced
      with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
enums:
  MatrixEnum:
    name: MatrixEnum
    definition_uri: https://w3id.org/linkml/geodata/MatrixEnum
    description: The medium or material in which a measurement was made or from which
      a specimen was collected. Terms are aligned to ENVO.
    from_schema: https://w3id.org/linkml/geodata
    permissible_values:
      soil:
        text: soil
        description: Terrestrial soil
        meaning: envo:00001998
      water:
        text: water
        description: Generic / unspecified water
        meaning: envo:00002006
      freshwater:
        text: freshwater
        description: Fresh surface water (rivers, lakes, streams)
        meaning: envo:00002004
      seawater:
        text: seawater
        description: Marine or ocean water
        meaning: envo:00002149
      groundwater:
        text: groundwater
        description: Subsurface groundwater
        meaning: envo:01001004
      pore_water:
        text: pore_water
        description: Water occupying pore spaces of soil or sediment
        meaning: envo:01001057
      air:
        text: air
        description: Atmospheric air
        meaning: envo:00002005
      atmosphere:
        text: atmosphere
        description: The atmosphere as a whole-system feature of interest
        meaning: envo:01000810
      sediment:
        text: sediment
        description: Unconsolidated sediment
        meaning: envo:00002007
      rock:
        text: rock
        description: Consolidated rock
        meaning: envo:00001995
      ice:
        text: ice
        description: Glacial or sea ice
        meaning: envo:00002209
      snow:
        text: snow
        description: Snow pack
        meaning: envo:01000406
      permafrost:
        text: permafrost
        description: Perennially frozen ground
        meaning: envo:00000134
      biota:
        text: biota
        description: Living organisms or biological tissue
        meaning: envo:00000016
  AggregationMethodEnum:
    name: AggregationMethodEnum
    definition_uri: https://w3id.org/linkml/geodata/AggregationMethodEnum
    description: Statistical function used to derive an AggregateObservation.
    from_schema: https://w3id.org/linkml/geodata
    permissible_values:
      mean:
        text: mean
        description: Arithmetic mean of input values
      max:
        text: max
        description: Maximum of input values
      min:
        text: min
        description: Minimum of input values
      median:
        text: median
        description: Median of input values
      std_dev:
        text: std_dev
        description: Standard deviation of input values
      sum:
        text: sum
        description: Sum of input values
      count:
        text: count
        description: Count of non-missing input values
      range:
        text: range
        description: Difference between maximum and minimum
      percentile_25:
        text: percentile_25
        description: 25th percentile
      percentile_75:
        text: percentile_75
        description: 75th percentile
      percentile_95:
        text: percentile_95
        description: 95th percentile
  SpecimenTypeEnum:
    name: SpecimenTypeEnum
    definition_uri: https://w3id.org/linkml/geodata/SpecimenTypeEnum
    description: The kind of discrete physical specimen collected from the environment.
    from_schema: https://w3id.org/linkml/geodata
    permissible_values:
      rock:
        text: rock
        description: Consolidated rock sample
      sediment:
        text: sediment
        description: Loose unconsolidated sediment
      sediment_core:
        text: sediment_core
        description: A drilled or pushed sediment core
      ice_core:
        text: ice_core
        description: A drilled ice core
      soil:
        text: soil
        description: Soil sample
      water:
        text: water
        description: Collected water sample (bottle, bag, etc.)
      biological_tissue:
        text: biological_tissue
        description: Biological tissue or whole organism
      mineral:
        text: mineral
        description: Individual mineral specimen
      fluid:
        text: fluid
        description: Non-water fluid sample (e.g. hydrothermal fluid, oil)
      gas:
        text: gas
        description: Gas sample
      peat:
        text: peat
        description: Peat or organic-rich deposit
      coral:
        text: coral
        description: Coral skeleton
      tree_ring:
        text: tree_ring
        description: Tree ring / dendrochronology sample
      speleothem:
        text: speleothem
        description: Cave deposit (stalactite, stalagmite, flowstone, etc.)
      dust:
        text: dust
        description: Atmospheric dust or aerosol trap sample
      other:
        text: other
        description: Specimen type not covered by the other terms
  QualityFlagEnum:
    name: QualityFlagEnum
    definition_uri: https://w3id.org/linkml/geodata/QualityFlagEnum
    description: QA/QC status of a measurement or aggregate observation.
    from_schema: https://w3id.org/linkml/geodata
    permissible_values:
      good:
        text: good
        description: Value passed all quality checks
      suspect:
        text: suspect
        description: Value may be unreliable; use with caution
      bad:
        text: bad
        description: Value failed quality checks and should not be used
      missing:
        text: missing
        description: Value is absent or could not be obtained
      estimated:
        text: estimated
        description: Value was estimated or gap-filled
slots:
  term_id:
    name: term_id
    definition_uri: https://w3id.org/linkml/geodata/term_id
    description: URI of the term in a source vocabulary (e.g. a QUDT unit URI or a
      CF standard name URI).
    from_schema: https://w3id.org/linkml/geodata
    mappings:
    - schema:identifier
    slot_uri: schema:identifier
    identifier: true
    owner: Unit
    domain_of:
    - MeasurementType
    - Unit
    range: uri
    required: true
  matrix:
    name: matrix
    definition_uri: https://w3id.org/linkml/geodata/matrix
    description: The medium or material in which a measurement was made or from which
      a specimen was collected (feature of interest at the medium level).
    from_schema: https://w3id.org/linkml/geodata
    mappings:
    - geodata:matrix
    slot_uri: geodata:matrix
    owner: TimeSeries
    domain_of:
    - Measurement
    - AggregateObservation
    - TimeSeries
    range: MatrixEnum
  geolocation:
    name: geolocation
    definition_uri: https://w3id.org/linkml/geodata/geolocation
    description: Spatial location associated with this entity.
    from_schema: https://w3id.org/linkml/geodata
    mappings:
    - geodata:geolocation
    slot_uri: geodata:geolocation
    owner: TimeSeries
    domain_of:
    - Measurement
    - AggregateObservation
    - TimeSeries
    range: Geolocation
    inlined: true
    inlined_as_list: true
  specimen:
    name: specimen
    definition_uri: https://w3id.org/linkml/geodata/specimen
    description: Physical specimen associated with the observation, if the measurement
      was made on a collected object rather than in situ.
    from_schema: https://w3id.org/linkml/geodata
    mappings:
    - geodata:specimen
    slot_uri: geodata:specimen
    owner: AggregateObservation
    domain_of:
    - Measurement
    - AggregateObservation
    range: Specimen
  quality_flag:
    name: quality_flag
    definition_uri: https://w3id.org/linkml/geodata/quality_flag
    description: QA/QC status of the value.
    from_schema: https://w3id.org/linkml/geodata
    mappings:
    - geodata:quality_flag
    slot_uri: geodata:quality_flag
    owner: AggregateObservation
    domain_of:
    - Measurement
    - AggregateObservation
    range: QualityFlagEnum
  measurements:
    name: measurements
    definition_uri: https://w3id.org/linkml/geodata/measurements
    description: Measurement objects belonging to this collection.
    from_schema: https://w3id.org/linkml/geodata
    mappings:
    - geodata:measurements
    slot_uri: geodata:measurements
    owner: Dataset
    domain_of:
    - TimeSeries
    - Dataset
    range: Measurement
    multivalued: true
    inlined: true
    inlined_as_list: true
  label:
    name: label
    definition_uri: https://w3id.org/linkml/geodata/label
    description: Human-readable name or label for this entity.
    from_schema: https://w3id.org/linkml/geodata
    mappings:
    - schema:name
    slot_uri: schema:name
    owner: TimeSeries
    domain_of:
    - MeasurementType
    - Unit
    - Specimen
    - TimeSeries
    range: string
  description:
    name: description
    definition_uri: https://w3id.org/linkml/geodata/description
    description: Free-text description of this entity.
    from_schema: https://w3id.org/linkml/geodata
    mappings:
    - schema:description
    slot_uri: schema:description
    owner: Dataset
    domain_of:
    - Specimen
    - Dataset
    range: string
  temporal_extent:
    name: temporal_extent
    definition_uri: https://w3id.org/linkml/geodata/temporal_extent
    description: Time interval associated with this entity.
    from_schema: https://w3id.org/linkml/geodata
    mappings:
    - sosa:phenomenonTime
    slot_uri: sosa:phenomenonTime
    owner: Dataset
    domain_of:
    - Measurement
    - AggregateObservation
    - TimeSeries
    - Dataset
    range: TemporalExtent
    inlined: true
    inlined_as_list: true
  spatial_extent:
    name: spatial_extent
    definition_uri: https://w3id.org/linkml/geodata/spatial_extent
    description: Spatial footprint encoded as WKT (bounding box, polygon, etc.).
    from_schema: https://w3id.org/linkml/geodata
    mappings:
    - geodata:spatialExtent
    slot_uri: geodata:spatialExtent
    owner: Dataset
    domain_of:
    - AggregateObservation
    - Dataset
    range: WKTLiteral
  measurement_type:
    name: measurement_type
    definition_uri: https://w3id.org/linkml/geodata/measurement_type
    description: The property that was measured or observed.
    from_schema: https://w3id.org/linkml/geodata
    mappings:
    - sosa:observedProperty
    slot_uri: sosa:observedProperty
    owner: TimeSeries
    domain_of:
    - Measurement
    - AggregateObservation
    - TimeSeries
    range: MeasurementType
    inlined: true
    inlined_as_list: false
  value:
    name: value
    definition_uri: https://w3id.org/linkml/geodata/value
    description: The measured result. Stored as a string to accommodate both numeric
      and categorical values. Numeric values MUST be parseable as a float.
    from_schema: https://w3id.org/linkml/geodata
    mappings:
    - sosa:hasSimpleResult
    slot_uri: sosa:hasSimpleResult
    owner: AggregateObservation
    domain_of:
    - Measurement
    - AggregateObservation
    range: string
  unit:
    name: unit
    definition_uri: https://w3id.org/linkml/geodata/unit
    description: Unit of the measured value.
    from_schema: https://w3id.org/linkml/geodata
    mappings:
    - qudt:hasUnit
    slot_uri: qudt:hasUnit
    owner: AggregateObservation
    domain_of:
    - Measurement
    - AggregateObservation
    range: Unit
    inlined: true
    inlined_as_list: false
  license:
    name: license
    definition_uri: https://w3id.org/linkml/geodata/license
    description: URI of the license governing use of this entity.
    from_schema: https://w3id.org/linkml/geodata
    mappings:
    - schema:license
    slot_uri: schema:license
    owner: Dataset
    domain_of:
    - Specimen
    - Measurement
    - TimeSeries
    - Dataset
    range: uri
  access_rights:
    name: access_rights
    definition_uri: https://w3id.org/linkml/geodata/access_rights
    description: Statement of access conditions.
    from_schema: https://w3id.org/linkml/geodata
    mappings:
    - schema:conditionsOfAccess
    slot_uri: schema:conditionsOfAccess
    owner: Measurement
    domain_of:
    - Specimen
    - Measurement
    range: string
  latitude:
    name: latitude
    definition_uri: https://w3id.org/linkml/geodata/latitude
    description: "WGS84 decimal latitude (\u221290 to +90)."
    from_schema: https://w3id.org/linkml/geodata
    mappings:
    - geodata:latitude
    slot_uri: geodata:latitude
    owner: Geolocation
