classes:
  Geolocation:
    name: Geolocation
    definition_uri: https://w3id.org/linkml/geodata/Geolocation
    description: A spatial location expressed as a point, geometry, or named feature.
      At least one of (latitude + longitude), wkt_geometry, or place_uri MUST be provided.
    from_schema: https://w3id.org/linkml/geodata
    mappings:
    - geo:Feature
    slots:
    - latitude
    - longitude
    - altitude
    - wkt_geometry
    - place_uri
    - coordinate_system
    class_uri: geo:Feature
  TemporalExtent:
    name: TemporalExtent
    definition_uri: https://w3id.org/linkml/geodata/TemporalExtent
    description: A closed time interval defined by a start and end instant.
    from_schema: https://w3id.org/linkml/geodata
    mappings:
    - owl_time:ProperInterval
    slots:
    - start_time
    - end_time
    class_uri: owl_time:ProperInterval
  MeasurementType:
    name: MeasurementType
    definition_uri: https://w3id.org/linkml/geodata/MeasurementType
    description: A measured or observed property drawn from a controlled vocabulary
      such as CF Conventions, SWEET, or ENVO. Maps to sosa:ObservableProperty.
    from_schema: https://w3id.org/linkml/geodata
    mappings:
    - sosa:ObservableProperty
    slots:
    - term_id
    - MeasurementType_label
    - source_vocabulary
    - definition
    slot_usage:
      label:
        name: label
        description: Human-readable name for the property (e.g. "air_temperature").
        required: true
    class_uri: sosa:ObservableProperty
  Unit:
    name: Unit
    definition_uri: https://w3id.org/linkml/geodata/Unit
    description: A unit of measure aligned with QUDT and expressible in UCUM notation.
      Maps to qudt:Unit.
    from_schema: https://w3id.org/linkml/geodata
    mappings:
    - qudt:Unit
    slots:
    - term_id
    - Unit_label
    - ucum_code
    slot_usage:
      label:
        name: label
        description: Human-readable unit label (e.g. "degree Celsius").
        required: true
    class_uri: qudt:Unit
  Specimen:
    name: Specimen
    definition_uri: https://w3id.org/linkml/geodata/Specimen
    description: 'A discrete physical or digital object collected from the environment
      and subsequently measured or analysed. First-class entity: it persists across
      time and may be the subject of many Measurements. Maps to sosa:Sample and iSamples
      PhysicalSample.'
    from_schema: https://w3id.org/linkml/geodata
    mappings:
    - sosa:Sample
    slots:
    - specimen_id
    - specimen_type
    - Specimen_label
    - material
    - collection_location
    - collection_time
    - collected_by
    - parent_specimen
    - repository
    - curation_location
    - description
    - preparation_method
    - mass
    - access_rights
    - license
    slot_usage:
      label:
        name: label
        description: Human-readable name or field number (e.g. "Core 3A, Section 2").
    class_uri: sosa:Sample
  Measurement:
    name: Measurement
    definition_uri: https://w3id.org/linkml/geodata/Measurement
    description: A single observed value of a property at a location and time. The
      fundamental atomic unit of the schema. Maps to sosa:Observation.
    from_schema: https://w3id.org/linkml/geodata
    mappings:
    - sosa:Observation
    slots:
    - Measurement_matrix
    - Measurement_geolocation
    - specimen
    - quality_flag
    - Measurement_measurement_type
    - Measurement_value
    - Measurement_unit
    - Measurement_result_time
    - temporal_extent
    - instrument
    - uncertainty
    - depth
    - elevation
    - observer
    - laboratory
    - project
    - dataset
    - license
    - access_rights
    slot_usage:
      matrix:
        name: matrix
        required: true
      geolocation:
        name: geolocation
        required: true
      measurement_type:
        name: measurement_type
        required: true
      value:
        name: value
        required: true
      unit:
        name: unit
        required: true
      result_time:
        name: result_time
        required: true
    class_uri: sosa:Observation
  AggregateObservation:
    name: AggregateObservation
    definition_uri: https://w3id.org/linkml/geodata/AggregateObservation
    description: A single derived value produced by applying a statistical function
      to a set of Measurement or TimeSeries inputs (e.g. monthly mean temperature,
      annual maximum flood depth, site-level median pH). Maps to sosa:Observation
      with a sosa:Procedure describing the aggregation; provenance tracked via prov:wasDerivedFrom.
    from_schema: https://w3id.org/linkml/geodata
    mappings:
    - sosa:Observation
    slots:
    - matrix
    - geolocation
    - specimen
    - quality_flag
    - aggregation_method
    - AggregateObservation_value
    - AggregateObservation_unit
    - AggregateObservation_measurement_type
    - input_measurements
    - input_time_series
    - sample_count
    - temporal_extent
    - spatial_extent
    - missing_value_treatment
    slot_usage:
      value:
        name: value
        description: The resulting aggregate value.
        range: float
        required: true
      unit:
        name: unit
        required: true
      measurement_type:
        name: measurement_type
        description: The property being summarised.
        required: true
    class_uri: sosa:Observation
  TimeSeries:
    name: TimeSeries
    definition_uri: https://w3id.org/linkml/geodata/TimeSeries
    description: An ordered collection of Measurement objects sharing a common measurement
      type, matrix, and geolocation, varying over time. Maps to sosa:ObservationCollection.
    from_schema: https://w3id.org/linkml/geodata
    mappings:
    - sosa:ObservationCollection
    slots:
    - matrix
    - geolocation
    - TimeSeries_measurements
    - temporal_extent
    - temporal_resolution
    - measurement_type
    - platform
    - TimeSeries_label
    - license
    slot_usage:
      measurements:
        name: measurements
        required: true
        inlined_as_list: true
      label:
        name: label
        description: Human-readable name for this time series.
    class_uri: sosa:ObservationCollection
  Dataset:
    name: Dataset
    definition_uri: https://w3id.org/linkml/geodata/Dataset
    description: A named, curated collection of Measurements, TimeSeries, and/or AggregateObservations.
      Maps to schema:Dataset and gl:Dataset.
    from_schema: https://w3id.org/linkml/geodata
    mappings:
    - schema:Dataset
    slots:
    - dataset_id
    - title
    - description
    - measurements
    - time_series
    - aggregate_observations
    - Dataset_temporal_extent
    - Dataset_spatial_extent
    - creator
    - publisher
    - license
    - keywords
    - version
    - doi
    slot_usage:
      temporal_extent:
        name: temporal_extent
        description: Overall temporal coverage of the dataset.
        slot_uri: schema:temporalCoverage
      spatial_extent:
        name: spatial_extent
        description: Overall spatial coverage of the dataset (WKT bounding box or
          polygon).
        slot_uri: schema:spatialCoverage
    class_uri: schema:Dataset
    tree_root: true
