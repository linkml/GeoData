    - geolocation__longitude
    - geolocation__altitude
    - geolocation__wkt_geometry
    - geolocation__place_uri
    - geolocation__coordinate_system
    attributes:
      latitude:
        name: latitude
        description: "WGS84 decimal latitude (\u221290 to +90)."
        range: DecimalDegree
        minimum_value: -90
        maximum_value: 90
      longitude:
        name: longitude
        description: "WGS84 decimal longitude (\u2212180 to +180)."
        range: DecimalDegree
        minimum_value: -180
        maximum_value: 180
      altitude:
        name: altitude
        description: Altitude above the WGS84 ellipsoid, in metres.
        range: float
      wkt_geometry:
        name: wkt_geometry
        description: Geometry (point, line, polygon, bounding box, etc.) encoded as
          a WKT literal. Use for transects, polygonal areas, or when a point is insufficient.
        slot_uri: geo:asWKT
        range: WKTLiteral
      place_uri:
        name: place_uri
        description: URI of a named place (e.g. a GeoNames, Wikidata, or GeoLink feature)
          that identifies the location.
        range: uri
      coordinate_system:
        name: coordinate_system
        description: Coordinate reference system identifier. Defaults to WGS84 (EPSG:4326)
          when absent.
        ifabsent: string(WGS84)
        range: string
    class_uri: geo:Feature
  TemporalExtent:
    name: TemporalExtent
    definition_uri: https://w3id.org/linkml/geodata/TemporalExtent
    description: A closed time interval defined by a start and end instant.
    from_schema: https://w3id.org/linkml/geodata
    mappings:
    - owl_time:ProperInterval
    slots:
    - temporalExtent__start_time
    - temporalExtent__end_time
    attributes:
      start_time:
        name: start_time
        description: Start of the interval (ISO 8601 datetime).
        slot_uri: owl_time:hasBeginning
        range: datetime
        required: true
      end_time:
        name: end_time
        description: End of the interval (ISO 8601 datetime).
        slot_uri: owl_time:hasEnd
        range: datetime
        required: true
    class_uri: owl_time:ProperInterval
  MeasurementType:
    name: MeasurementType
    definition_uri: https://w3id.org/linkml/geodata/MeasurementType
    description: A measured or observed property drawn from a controlled vocabulary
      such as CF Conventions, SWEET, or ENVO. Maps to sosa:ObservableProperty.
    from_schema: https://w3id.org/linkml/geodata
    mappings:
    - sosa:ObservableProperty
    slots:
    - term_id
    - measurementType__label
    - measurementType__source_vocabulary
    - measurementType__definition
    attributes:
      label:
        name: label
        description: Human-readable name for the property (e.g. "air_temperature").
        slot_uri: schema:name
        range: string
        required: true
      source_vocabulary:
        name: source_vocabulary
        description: The vocabulary from which the term is drawn (e.g. "CF Conventions",
          "SWEET", "ENVO").
        range: string
      definition:
        name: definition
        description: Textual definition of the property.
        slot_uri: schema:description
        range: string
    class_uri: sosa:ObservableProperty
  Unit:
    name: Unit
    definition_uri: https://w3id.org/linkml/geodata/Unit
    description: A unit of measure aligned with QUDT and expressible in UCUM notation.
      Maps to qudt:Unit.
    from_schema: https://w3id.org/linkml/geodata
    mappings:
    - qudt:Unit
    slots:
    - term_id
    - unit__label
    - unit__ucum_code
    attributes:
      label:
        name: label
        description: Human-readable unit label (e.g. "degree Celsius").
        slot_uri: schema:name
        range: string
        required: true
      ucum_code:
        name: ucum_code
        description: UCUM expression for the unit (e.g. "Cel", "m/s", "g/cm3").
        range: UCUMExpression
    class_uri: qudt:Unit
  Specimen:
    name: Specimen
    definition_uri: https://w3id.org/linkml/geodata/Specimen
    description: 'A discrete physical or digital object collected from the environment
      and subsequently measured or analysed. First-class entity: it persists across
      time and may be the subject of many Measurements. Maps to sosa:Sample and iSamples
      PhysicalSample.'
    from_schema: https://w3id.org/linkml/geodata
    mappings:
    - sosa:Sample
    slots:
    - specimen__specimen_id
    - specimen__specimen_type
    - specimen__label
    - specimen__material
    - specimen__collection_location
    - specimen__collection_time
    - specimen__collected_by
    - specimen__parent_specimen
    - specimen__repository
    - specimen__curation_location
    - specimen__description
    - specimen__preparation_method
    - specimen__mass
    - specimen__access_rights
    - specimen__license
    attributes:
      specimen_id:
        name: specimen_id
        description: Globally unique identifier for the specimen. Preferably an IGSN
          (e.g. https://igsn.org/AU1234567) or another persistent URI.
        slot_uri: schema:identifier
        identifier: true
        range: uri
        required: true
      specimen_type:
        name: specimen_type
        description: The kind of physical specimen.
        range: SpecimenTypeEnum
        required: true
      label:
        name: label
        description: Human-readable name or field number (e.g. "Core 3A, Section 2").
        slot_uri: schema:name
        range: string
      material:
        name: material
        description: Bulk material of the specimen using iSamples Material vocabulary
          terms (e.g. "RockOrSediment", "NaturalSolidMaterial", "Fluid", "BiogenicNonOrganicMaterial").
        slot_uri: isam:material
        range: string
      collection_location:
        name: collection_location
        description: Location where the specimen was collected.
        range: Geolocation
        inlined: true
      collection_time:
        name: collection_time
        description: Date and time of collection (ISO 8601).
        slot_uri: sosa:resultTime
        range: datetime
      collected_by:
        name: collected_by
        description: Person or organisation responsible for collection.
        slot_uri: schema:contributor
        range: string
      parent_specimen:
        name: parent_specimen
        description: Parent specimen from which this one was derived (e.g. a subsample,
          aliquot, or thin section).
        slot_uri: sosa:isSampleOf
        range: Specimen
      repository:
        name: repository
        description: Institution or archive currently holding the specimen.
        range: string
      curation_location:
        name: curation_location
        description: Current physical storage location within the repository (e.g.
          "IODP Bremen Core Repository, Cabinet 7, Tray 3").
        range: string
      description:
        name: description
        description: Free-text description of the specimen.
        slot_uri: schema:description
        range: string
      preparation_method:
        name: preparation_method
        description: How the specimen was prepared for analysis.
        range: string
      mass:
        name: mass
        description: Mass of the specimen in grams.
        range: float
      access_rights:
        name: access_rights
        description: Statement of access conditions for specimen data.
        slot_uri: schema:conditionsOfAccess
        range: string
      license:
        name: license
        description: URI of the license governing use of specimen metadata.
        slot_uri: schema:license
        range: uri
    class_uri: sosa:Sample
  Measurement:
    name: Measurement
    definition_uri: https://w3id.org/linkml/geodata/Measurement
    description: A single observed value of a property at a location and time. The
      fundamental atomic unit of the schema. Maps to sosa:Observation.
    from_schema: https://w3id.org/linkml/geodata
    mappings:
    - sosa:Observation
    slots:
    - Measurement_matrix
    - Measurement_geolocation
    - specimen
    - quality_flag
    - measurement__measurement_type
    - measurement__value
    - measurement__unit
    - measurement__time
    - measurement__temporal_extent
    - measurement__instrument
    - measurement__uncertainty
    - measurement__depth
    - measurement__elevation
    - measurement__observer
    - measurement__laboratory
    - measurement__project
    - measurement__dataset
    - measurement__license
    - measurement__access_rights
    slot_usage:
      matrix:
        name: matrix
        required: true
      geolocation:
        name: geolocation
        required: true
    attributes:
      measurement_type:
        name: measurement_type
        description: The property that was measured.
        slot_uri: sosa:observedProperty
        range: MeasurementType
        required: true
        inlined: true
      value:
        name: value
        description: The measured result. Stored as a string to accommodate both numeric
          and categorical values. Numeric values MUST be parseable as a float.
        slot_uri: sosa:hasSimpleResult
        range: string
        required: true
      unit:
        name: unit
        description: Unit of the measured value.
        slot_uri: qudt:hasUnit
        range: Unit
        required: true
        inlined: true
      time:
        name: time
        description: Date and time at which the measurement was made (ISO 8601). Use
          temporal_extent instead when the observation spans an interval.
        slot_uri: sosa:resultTime
        range: datetime
        required: true
      temporal_extent:
        name: temporal_extent
        description: Time interval of the measurement, used in place of `time` when
          the observation spans a period rather than an instant.
        slot_uri: sosa:phenomenonTime
        range: TemporalExtent
        inlined: true
      instrument:
        name: instrument
        description: Sensor, instrument, or analytical method used.
        slot_uri: sosa:madeBySensor
        range: string
      uncertainty:
        name: uncertainty
        description: Measurement uncertainty expressed in the same unit as value (e.g.
          one standard deviation or half-width of a 95 % CI).
        range: float
      depth:
        name: depth
        description: Depth below surface in metres (positive downward).
        range: float
      elevation:
        name: elevation
        description: Elevation above reference datum in metres.
        range: float
      observer:
        name: observer
        description: Person or organisation who made the measurement.
        slot_uri: prov:wasAssociatedWith
        range: string
      laboratory:
        name: laboratory
        description: Laboratory or facility where analysis was performed.
        range: string
      project:
        name: project
        description: Project or programme under which the measurement was made.
        range: string
      dataset:
        name: dataset
        description: Dataset or collection to which this measurement belongs.
        range: string
      license:
        name: license
        description: URI of the license governing use of this measurement.
        slot_uri: schema:license
        range: uri
      access_rights:
        name: access_rights
        description: Statement of access conditions.
        slot_uri: schema:conditionsOfAccess
        range: string
    class_uri: sosa:Observation
  AggregateObservation:
    name: AggregateObservation
    definition_uri: https://w3id.org/linkml/geodata/AggregateObservation
    description: A single derived value produced by applying a statistical function
      to a set of Measurement or TimeSeries inputs (e.g. monthly mean temperature,
      annual maximum flood depth, site-level median pH). Maps to sosa:Observation
      with a sosa:Procedure describing the aggregation; provenance tracked via prov:wasDerivedFrom.
    from_schema: https://w3id.org/linkml/geodata
    mappings:
    - sosa:Observation
    slots:
    - matrix
    - geolocation
    - specimen
    - quality_flag
    - aggregateObservation__aggregation_method
    - aggregateObservation__value
    - aggregateObservation__unit
    - aggregateObservation__measurement_type
    - aggregateObservation__input_measurements
    - aggregateObservation__input_time_series
    - aggregateObservation__sample_count
    - aggregateObservation__temporal_extent
    - aggregateObservation__spatial_extent
    - aggregateObservation__missing_value_treatment
    attributes:
      aggregation_method:
        name: aggregation_method
        description: The statistical function applied to the input measurements.
        slot_uri: sosa:usedProcedure
        range: AggregationMethodEnum
        required: true
      value:
        name: value
        description: The resulting aggregate value.
        slot_uri: sosa:hasSimpleResult
        range: float
        required: true
      unit:
        name: unit
        description: Unit of the aggregate value.
        slot_uri: qudt:hasUnit
        range: Unit
        required: true
        inlined: true
      measurement_type:
        name: measurement_type
        description: The property being summarised.
        slot_uri: sosa:observedProperty
        range: MeasurementType
        required: true
        inlined: true
      input_measurements:
        name: input_measurements
        description: Measurement objects that were aggregated to produce this value.
        slot_uri: prov:wasDerivedFrom
        range: Measurement
        multivalued: true
      input_time_series:
        name: input_time_series
        description: TimeSeries objects used as input to this aggregation.
        slot_uri: prov:wasDerivedFrom
        range: TimeSeries
        multivalued: true
      sample_count:
        name: sample_count
        description: Number of non-missing input values included in the aggregation.
        range: integer
      temporal_extent:
        name: temporal_extent
        description: Time window over which the aggregation was performed.
        slot_uri: sosa:phenomenonTime
        range: TemporalExtent
        inlined: true
      spatial_extent:
        name: spatial_extent
        description: Spatial footprint over which aggregation was performed, encoded
          as WKT. Use when aggregating across multiple locations.
        range: WKTLiteral
      missing_value_treatment:
        name: missing_value_treatment
        description: How missing or null input values were handled prior to aggregation
          (e.g. "excluded", "interpolated", "zero-filled").
        range: string
    class_uri: sosa:Observation
  TimeSeries:
    name: TimeSeries
    definition_uri: https://w3id.org/linkml/geodata/TimeSeries
    description: An ordered collection of Measurement objects sharing a common measurement
      type, matrix, and geolocation, varying over time. Maps to sosa:ObservationCollection.
    from_schema: https://w3id.org/linkml/geodata
    mappings:
    - sosa:ObservationCollection
    slots:
    - matrix
    - geolocation
    - TimeSeries_measurements
    - timeSeries__temporal_extent
    - timeSeries__temporal_resolution
    - timeSeries__measurement_type
    - timeSeries__platform
    - timeSeries__label
    - timeSeries__license
    slot_usage:
      measurements:
        name: measurements
        required: true
        inlined_as_list: true
    attributes:
      temporal_extent:
        name: temporal_extent
        description: Overall start and end datetime of the series.
        range: TemporalExtent
        inlined: true
      temporal_resolution:
        name: temporal_resolution
        description: Nominal sampling interval as an ISO 8601 duration (e.g. "PT1H"
          = hourly, "P1D" = daily, "P1M" = monthly).
        range: string
      measurement_type:
        name: measurement_type
        description: Shared measurement type for all members of this series.
        slot_uri: sosa:observedProperty
        range: MeasurementType
        inlined: true
      platform:
        name: platform
        description: Observing platform or station type (e.g. "weather station", "moored
          buoy", "flux tower", "research vessel", "satellite").
        range: string
      label:
        name: label
        description: Human-readable name for this time series.
        slot_uri: schema:name
        range: string
      license:
        name: license
        description: URI of the license governing use of this time series.
        slot_uri: schema:license
        range: uri
    class_uri: sosa:ObservationCollection
  Dataset:
    name: Dataset
    definition_uri: https://w3id.org/linkml/geodata/Dataset
    description: A named, curated collection of Measurements, TimeSeries, and/or AggregateObservations.
      Maps to schema:Dataset and gl:Dataset.
    from_schema: https://w3id.org/linkml/geodata
    mappings:
    - schema:Dataset
    slots:
    - measurements
    - dataset__dataset_id
    - dataset__title
    - dataset__description
    - dataset__time_series
    - dataset__aggregate_observations
    - dataset__temporal_extent
    - dataset__spatial_extent
    - dataset__creator
    - dataset__publisher
    - dataset__license
    - dataset__keywords
    - dataset__version
    - dataset__doi
    attributes:
      dataset_id:
        name: dataset_id
        description: Globally unique identifier for the dataset (URI or DOI).
        slot_uri: schema:identifier
        identifier: true
        range: uri
        required: true
      title:
        name: title
        description: Human-readable title of the dataset.
        slot_uri: schema:name
        range: string
        required: true
      description:
        name: description
        description: Abstract or summary of the dataset contents.
        slot_uri: schema:description
        range: string
      time_series:
        name: time_series
        description: TimeSeries objects included in this dataset.
        range: TimeSeries
        multivalued: true
      aggregate_observations:
        name: aggregate_observations
        description: AggregateObservation objects included in this dataset.
        range: AggregateObservation
        multivalued: true
      temporal_extent:
        name: temporal_extent
        description: Overall temporal coverage of the dataset.
        slot_uri: schema:temporalCoverage
        range: TemporalExtent
        inlined: true
      spatial_extent:
        name: spatial_extent
        description: Overall spatial coverage of the dataset (WKT bounding box or
          polygon).
        slot_uri: schema:spatialCoverage
        range: WKTLiteral
      creator:
        name: creator
        description: Person or organisation that created the dataset.
        slot_uri: schema:creator
        range: string
      publisher:
        name: publisher
        description: Organisation that published or distributes the dataset.
        slot_uri: schema:publisher
        range: string
      license:
        name: license
        description: URI of the license governing use of this dataset.
        slot_uri: schema:license
        range: uri
      keywords:
        name: keywords
        description: Keywords or subject terms describing the dataset content.
        slot_uri: schema:keywords
        range: string
        multivalued: true
      version:
        name: version
        description: Version identifier (e.g. "1.0.0" or "2024-01").
        slot_uri: schema:version
        range: string
      doi:
        name: doi
        description: Digital Object Identifier for this dataset release.
        range: uri
    class_uri: schema:Dataset
    tree_root: true
